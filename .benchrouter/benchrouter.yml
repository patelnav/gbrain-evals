      capture_command: "npm run benchrouter:eval"
      mode: repository_executable
      api_family: "anthropic_messages"
      runtime: "bun"
      runtime_version: "1.3.10"
      lockfile: "bun.lock"
      result_path: ".benchrouter/executable-result.json"
      primary_metric: "recall_at_5"
      max_model_calls: 480
      max_cost_usd: 2
      max_cost_per_call_usd: 0.25
      timeout_minutes: 60
